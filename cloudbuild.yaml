# Cloud Build CI/CD configuration for AI Policy Compliance Checker
# Triggers on push to main branch.
# Set the OPENAI_API_KEY secret in Cloud Build → Secret Manager.
#
# Required substitutions (set in Cloud Build trigger):
#   _REGION          : GCP region (default: europe-west1)
#   _SERVICE_NAME    : Cloud Run service name (default: ai-compliance-checker)
#   _REPO_NAME       : Artifact Registry repo name (default: ai-compliance-checker)

substitutions:
  _REGION: "europe-west1"
  _SERVICE_NAME: "ai-compliance-checker"
  _REPO_NAME: "ai-compliance-checker"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Build Docker image
  # -------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "--platform"
      - "linux/amd64"
      - "--tag"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA"
      - "--tag"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "--file"
      - "Dockerfile"
      - "."

  # -------------------------------------------------------------------------
  # Step 2: Push image to Artifact Registry
  # -------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}"

  # -------------------------------------------------------------------------
  # Step 3: Deploy to Cloud Run
  # -------------------------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA"
      - "--platform=managed"
      - "--region=${_REGION}"
      - "--allow-unauthenticated"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--concurrency=80"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--timeout=60"
      - "--port=8000"
      - "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest"
      - "--quiet"

# Push built images to Artifact Registry
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest"

# Build options
options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

# Build timeout
timeout: "1200s"
